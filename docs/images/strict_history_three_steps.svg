<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">严格历史数据三步操作</title>
  <desc id="desc">在聚宽导出，下载 ZIP，再拖到一键上传脚本，脚本自动校验、上传、备份和导入。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="#f8fafc"/>
  <text x="50" y="54" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#0f172a">你每天只需要做这三步</text>

  <g filter="url(#shadow)">
    <rect x="50" y="95" width="220" height="130" rx="18" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="135" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">① 聚宽导出</text>
    <text x="160" y="176" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">运行正式导出单元格</text>
    <text x="160" y="204" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">等待出现 .zip 路径</text>
  </g>

  <line x1="275" y1="160" x2="325" y2="160" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="330" y="95" width="220" height="130" rx="18" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/>
    <text x="440" y="135" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">② 下载 ZIP</text>
    <text x="440" y="176" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">保存到“下载”文件夹</text>
    <text x="440" y="204" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">不要解压，不要改名</text>
  </g>

  <line x1="555" y1="160" x2="605" y2="160" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="610" y="95" width="250" height="130" rx="18" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/>
    <text x="735" y="135" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">③ 拖到脚本</text>
    <text x="735" y="174" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#334155">一键上传严格历史数据.cmd</text>
    <text x="735" y="204" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">松开鼠标，等待绿色提示</text>
  </g>

  <line x1="865" y1="160" x2="915" y2="160" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="920" y="95" width="230" height="130" rx="65" fill="#eaf8ef" stroke="#16803a" stroke-width="2"/>
    <text x="1035" y="145" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#166534">导入成功</text>
    <text x="1035" y="181" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#166534">校验、上传、备份、导入</text>
    <text x="1035" y="207" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#166534">都已自动完成</text>
  </g>

  <text x="50" y="282" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#475569">如果出现红色提示：不要反复操作，把窗口截图发给我即可；本地 ZIP 不会被删除。</text>
</svg>
